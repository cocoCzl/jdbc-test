spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 250MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jdbc-test:
  storage:
    data-directory: ${JDBC_TEST_DATA_DIRECTORY:./data}
    max-artifacts: 20
    max-file-size: 104857600
    max-package-size: 262144000
  worker:
    executable: ${JDBC_TEST_WORKER_EXECUTABLE:}
    driver-validation-timeout: 30s
    connection-probe-timeout: 30s
    termination-grace-period: 2s
  security:
    master-key: ${JDBC_TEST_MASTER_KEY}
  execution:
    max-concurrent-runs: ${JDBC_TEST_MAX_CONCURRENT_RUNS:1}
    run-timeout: ${JDBC_TEST_RUN_TIMEOUT:30m}
    termination-grace-period: 2s
