server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
spring:
  config:
    import: classpath:application-production.yml
jdbc-test:
  web:
    directory: /app/web
  storage:
    data-directory: ${JDBC_TEST_DATA_DIRECTORY:/data/jdbc-test}
  worker:
    executable: ${JDBC_TEST_WORKER_EXECUTABLE:/app/worker/jdbc-test-worker.jar}
