name: CI

on:
  push:
  pull_request:

jobs:
  cross-platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Python contracts and adapters
        env:
          PYTHONPATH: scripts
        run: python scripts/run_contract_tests.py
      - name: Validate Java configuration and SQL splitting
        run: mvn -q -Dtest=ConfigLoaderTest,SqlSplitterTest test
      - name: Build driver-free release archive
        run: python scripts/build_release.py --output dist
