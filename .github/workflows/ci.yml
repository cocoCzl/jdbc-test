name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-contracts:
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test limited Java rule checker contracts
        run: python -B -m unittest discover -s scripts -p 'test_java_rules.py' -v
      - name: Check Java sources against reviewed occurrence baseline
        run: python -B scripts/check_java_rules.py
      - name: Validate Python contracts and adapters
        env:
          PYTHONPATH: scripts
        run: python scripts/run_contract_tests.py
      - name: Validate Java configuration and SQL splitting
        run: mvn -q '-Dtest=ConfigLoaderTest,SqlSplitterTest' test
      - name: Build driver-free release archive
        run: python scripts/build_release.py --output dist

  production-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jdbc-test-web/package-lock.json
      - name: Require Docker for PostgreSQL integration tests
        run: docker info > /dev/null
      - name: JVM unit and disposable database integration tests
        run: ./mvnw -B -Pworker-e2e,server-integration clean verify
      - name: Require representative integration tests to execute
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = {"WorkerPostgresIT", "WorkerConnectionProbeIT", "RunPostgresIT",
                      "PlatformPersistenceIT", "PlatformUpgradeIT", "QuerySummaryMigrationIT", "RunEventCommitIT"}
          for report in Path(".").glob("jdbc-test-*/target/failsafe-reports/TEST-*.xml"):
              suite = ET.parse(report).getroot()
              name = suite.attrib["name"].rsplit(".", 1)[-1]
              if name in required:
                  assert int(suite.attrib["tests"]) > 0, name
                  assert all(int(suite.attrib.get(key, 0)) == 0 for key in ("skipped", "errors", "failures")), name
                  required.remove(name)
          assert not required, f"Missing integration reports: {sorted(required)}"
          PYTHON
      - name: Frontend regression
        working-directory: jdbc-test-web
        run: npm ci && npm run lint && npm run test && npm run build
      - name: Install Chromium for mocked browser regression
        working-directory: jdbc-test-web
        run: npx playwright install --with-deps chromium
      - name: Mocked browser regression against built assets
        working-directory: jdbc-test-web
        env:
          JDBC_TEST_E2E_PREVIEW: "true"
        run: npm run test:e2e
      - name: Retain test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          retention-days: 7
          path: |
            jdbc-test-*/target/surefire-reports/
            jdbc-test-*/target/failsafe-reports/
            jdbc-test-web/test-results/
      - name: Validate Compose contract
        env:
          POSTGRES_PASSWORD: ci-validation-only
          JDBC_TEST_MASTER_KEY: ci-validation-only
          SPRING_DATASOURCE_URL: jdbc:postgresql://example.invalid:5432/jdbc_test
          SPRING_DATASOURCE_USERNAME: jdbc_test
          SPRING_DATASOURCE_PASSWORD: ci-validation-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.external.yml config --quiet
      - name: Package native server distribution
        run: ./jdbc-test build --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-server
          path: |
            dist/jdbc-test-server-*.tar.gz*
            dist/jdbc-test-server-*.zip*
      - name: Build production image without publishing
        run: docker build --build-arg REVISION=${{ github.sha }} -t jdbc-test:ci .
      - name: Verify all three deployment modes
        run: python3 scripts/test_deployment_runtime.py --image jdbc-test:ci --source-dev
