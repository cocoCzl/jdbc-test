name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build driver-free release archive
        run: python scripts/build_release.py --output dist
      - name: Verify checksum and archive contents
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "jdbc-test-${version}.zip"
          test -f "jdbc-test-${version}.zip.sha256"
          shasum -a 256 -c "jdbc-test-${version}.zip.sha256"
          if unzip -l "jdbc-test-${version}.zip" | grep -E '\.jar$|configs/|report/|docs/|CONTEXT\.md|config\.yaml\.example|lib/|\.DS_Store|\.idea/|\.classpath|\.project|\.settings/|target/'; then
            echo "Release archive contains forbidden runtime artifacts"
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "JDBC Test ${GITHUB_REF_NAME}"
